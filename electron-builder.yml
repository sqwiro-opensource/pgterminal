appId: com.pgterminal.app
productName: PgTerminal
copyright: Copyright © 2026 Bernard Gaitho
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  - '!**/.vscode/*'
  - '!src/*'
  - '!legacy/**'
  - '!tests/**'
  - '!.claude/**'
  - '!.github/**'
  - '!{docker-compose.test.yml,vitest.config.ts,vitest.workspace.ts}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,bun.lock,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: PgTerminal
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signed with the Developer ID in the login keychain and notarized with an App Store Connect
  # API key taken from the environment. See README "Building and releasing" for the variables.
  identity: Cloud Hub Limited (Q8B63F2ZRC)
  notarize: true
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Bernard Gaitho
  category: Development
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Releases and the update feed both live in the GitHub repo.
publish:
  provider: github
  owner: sqwiro-opensource
  repo: pgterminal
  # Published, not draft: the updater reads the latest published release, so a draft would ship
  # nothing to anyone already running the app.
  releaseType: release
