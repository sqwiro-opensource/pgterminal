# Disposable PostgreSQL 16 for `bun run test:integration`.
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down -v   # wipe and reseed next time
services:
  pg:
    image: postgres:16
    container_name: pgui-test-pg
    ports:
      - '54329:5432'
    environment:
      POSTGRES_USER: pgui
      POSTGRES_PASSWORD: pgui
      POSTGRES_DB: pgui_test
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'max_connections=200']
    shm_size: 512mb
    volumes:
      - ./tests/integration/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
      - ./tests/integration/manyTables.sql:/docker-entrypoint-initdb.d/02-manyTables.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pgui -d pgui_test']
      interval: 2s
      timeout: 3s
      retries: 60
