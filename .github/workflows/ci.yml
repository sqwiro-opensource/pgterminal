name: CI

on:
  push:
    branches: [master, v2-rewrite]
  pull_request:

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: Start Postgres and wait for the seed
        run: |
          docker compose -f docker-compose.test.yml up -d
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.test.yml exec -T pg pg_isready -U pgterminal -d pgui_test; then
              break
            fi
            sleep 2
          done
      - run: bun run test:integration
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - run: bun run build
