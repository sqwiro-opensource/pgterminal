name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate to GitHub Packages
        # @cloudhub-ux/* are published to npm.pkg.github.com and are not public, so a clone cannot
        # install them without a token. Add a PACKAGES_TOKEN repository secret with read:packages,
        # or make those packages public, and this step becomes unnecessary.
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate to GitHub Packages
        # @cloudhub-ux/* are published to npm.pkg.github.com and are not public, so a clone cannot
        # install them without a token. Add a PACKAGES_TOKEN repository secret with read:packages,
        # or make those packages public, and this step becomes unnecessary.
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc
      - run: bun install --frozen-lockfile
      - name: Start Postgres and wait for the seed
        run: |
          docker compose -f docker-compose.test.yml up -d
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.test.yml exec -T pg pg_isready -U pgui -d pgui_test; then
              break
            fi
            sleep 2
          done
      - run: bun run test:integration
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Authenticate to GitHub Packages
        # @cloudhub-ux/* are published to npm.pkg.github.com and are not public, so a clone cannot
        # install them without a token. Add a PACKAGES_TOKEN repository secret with read:packages,
        # or make those packages public, and this step becomes unnecessary.
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc
      - run: bun install --frozen-lockfile
      - run: bun run build
